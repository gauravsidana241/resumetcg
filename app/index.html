<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Interview prep as a trading card game" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Resume TCG</title>
  </head>
  <body>
    <!-- color filters for single-color cards: dark parts take the color, light parts turn white -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="mono-red" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.117 0.393 0.040 0 0.45
                  0.234 0.787 0.079 0 -0.1
                  0.234 0.787 0.079 0 -0.1
                  0 0 0 1 0"
        />
      </filter>
      <filter id="mono-blue" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.194 0.653 0.066 0 -0.013
                  0.163 0.549 0.055 0 0.133
                  0.095 0.320 0.032 0 0.453
                  0 0 0 1 0"
        />
      </filter>
      <filter id="mono-green" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.202 0.678 0.068 0 -0.048
                  0.131 0.441 0.045 0 0.284
                  0.176 0.591 0.060 0 0.074
                  0 0 0 1 0"
        />
      </filter>
      <filter id="mono-purple" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.139 0.468 0.047 0 0.246
                  0.187 0.629 0.064 0 0.020
                  0.096 0.321 0.032 0 0.451
                  0 0 0 1 0"
        />
      </filter>
      <filter id="mono-rose" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.100 0.337 0.034 0 0.429
                  0.198 0.666 0.067 0 -0.032
                  0.177 0.594 0.060 0 0.069
                  0 0 0 1 0"
        />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
